<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
        name="description"
        content="SnakeGame Remasterizado - jogo da cobrinha em TypeScript"
    />
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <title>SnakeGame · Remasterizado</title>
</head>
<body>
    <main class="hud">
        <section class="score" aria-label="Placar">
            <span>score</span>
            <span class="score--value">00</span>
        </section>
        <section class="hud__right">
            <section class="best" aria-label="Recorde">
                <span>record</span>
                <span class="best__value">00</span>
            </section>
            <section class="speed" aria-label="Velocidade">
                <span>speed</span>
                <span class="speed__value">1</span>
            </section>
        </section>
    </main>

    <div class="board">
        <canvas id="game" width="600" height="600"></canvas>

        <div class="menu-screen hide" id="menu">
            <span class="menu-screen__title" id="menuTitle">game over</span>
            <span class="menu-screen__final">
                score <strong id="final-score">00</strong>
            </span>
            <span class="menu-screen__best">
                record <strong id="final-best">00</strong>
            </span>
            <button class="btn-play" id="btn-play">
                <span class="material-symbols-outlined">play_circle</span>
                jogar novamente
            </button>
        </div>

        <div class="pause-screen hide" id="pause">
            <span class="material-symbols-outlined">pause_circle</span>
            <span>pausado</span>
        </div>
    </div>

    <p class="hint">use as setas / WASD para mover · espaço pausa</p>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
